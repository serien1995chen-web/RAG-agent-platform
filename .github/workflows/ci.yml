          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Restore Next cache
        uses: actions/cache@v4
        with:
          path: projects/app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'projects/app/next.config.ts') }}-${{ github.run_id }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'projects/app/next.config.ts') }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Start and initialize Mongo replica set
        run: |
          for attempt in 1 2 3; do
            if timeout 180 docker pull "$CI_MONGO_IMAGE"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Mongo image pull failed after three attempts."
              exit 1
            fi
            echo "::warning::Mongo image pull failed; retrying."
            sleep 5
          done
          docker run --detach --name kb-ci-mongo \
            --publish 27017:27017 \
            "$CI_MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec kb-ci-mongo mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker logs kb-ci-mongo
              exit 1
            fi
            sleep 1
          done
          docker exec kb-ci-mongo mongo --quiet --eval '
            const hello = db.hello();
            if (!hello.setName) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            } else if (hello.setName !== "rs0") {
              throw new Error(`unexpected replica set: ${hello.setName}`);
            }
          '
          for attempt in $(seq 1 60); do
            state="$(
              docker exec kb-ci-mongo mongo --quiet --eval '
                const status = rs.status();
                status.ok === 1 ? status.myState : -1;
              ' 2>/dev/null || true
            )"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-mongo
          docker exec kb-ci-mongo mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Start MinIO
        run: |
          if ! docker image inspect "$CI_MINIO_IMAGE" >/dev/null 2>&1; then
            for attempt in 1 2; do
              if timeout 600 docker pull "$CI_MINIO_IMAGE"; then
                break
              fi
              if [ "$attempt" = "2" ]; then
                echo "::error::MinIO image pull failed after two attempts."
                exit 1
              fi
              echo "::warning::MinIO image pull failed; retrying in 30 seconds."
              sleep 30
            done
          fi
          docker run --detach --name kb-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            "$CI_MINIO_IMAGE" server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-minio
          exit 1
      - name: Build application
        run: pnpm build
      - name: Build worker
        run: pnpm build:workers
      - name: Verify build artifacts
        run: |
          test -s projects/app/.next/BUILD_ID
          test -s projects/app/dist/workers/worker.mjs
      - name: B12 image-search performance
        run: pnpm exec vitest run --config test/performance/vitest.config.ts
      - name: Upload B12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b12-performance-evidence-${{ github.run_attempt }}
          path: test-results/b12/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop test containers
        if: always()
        run: docker rm --force kb-ci-mongo kb-ci-minio >/dev/null 2>&1 || true

  verify:
    name: verify
    needs: [quality, integration, b17-provider, e2e, performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all gates
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.b17-provider.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.performance.result }}" = "success"
