name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KB_ENV: test
  KB_TEST_MONGO_URI: mongodb://127.0.0.1:27017/kb_test?replicaSet=rs0
  KB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
  KB_TEST_PG_URL: postgresql://kb:kb_dev_password@127.0.0.1:5432/kb
  KB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
  KB_TEST_S3_REGION: us-east-1
  KB_TEST_S3_BUCKET: kb-test
  KB_TEST_S3_ACCESS_KEY: minioadmin
  KB_TEST_S3_SECRET_KEY: minioadmin
  CI_MONGO_IMAGE: mongo:5.0.32
  CI_MINIO_IMAGE: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture
        run: pnpm architecture:check
      - name: Forbidden files
        run: pnpm forbidden-files:check
      - name: SBOM
        run: pnpm sbom:generate
      - name: Licenses
        run: pnpm license:check
      - name: OpenAPI
        run: pnpm openapi:check
      - name: Knowledge inventory
        run: pnpm knowledge:inventory
      - name: Runtime boundary
        run: pnpm knowledge:check-runtime
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Build application
        run: pnpm build
      - name: Build worker
        run: pnpm build:workers
      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yml config

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Start and initialize Mongo replica set
        run: |
          timeout 180 docker pull "$CI_MONGO_IMAGE"
          docker run --detach --name kb-ci-mongo \
            --publish 27017:27017 \
            "$CI_MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec kb-ci-mongo mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker logs kb-ci-mongo
              exit 1
            fi
            sleep 1
          done
          docker exec kb-ci-mongo mongo --quiet --eval '
            const hello = db.hello();
            if (!hello.setName) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            } else if (hello.setName !== "rs0") {
              throw new Error(`unexpected replica set: ${hello.setName}`);
            }
          '
          for attempt in $(seq 1 60); do
            state="$(
              docker exec kb-ci-mongo mongo --quiet --eval '
                const status = rs.status();
                status.ok === 1 ? status.myState : -1;
              ' 2>/dev/null || true
            )"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-mongo
          docker exec kb-ci-mongo mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Start MinIO
        run: |
          timeout 300 docker pull "$CI_MINIO_IMAGE"
          docker run --detach --name kb-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            "$CI_MINIO_IMAGE" server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-minio
          exit 1
      - name: Integration tests
        run: pnpm test:integration
      - name: Tenant tests
        run: pnpm test:tenant
      - name: Concurrency tests
        run: pnpm test:concurrency
      - name: Fault tests
        run: pnpm test:fault
      - name: Stop test containers
        if: always()
        run: docker rm --force kb-ci-mongo kb-ci-minio >/dev/null 2>&1 || true

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Restore Next cache
        uses: actions/cache@v4
        with:
          path: projects/app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'projects/app/next.config.ts') }}-${{ github.run_id }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'projects/app/next.config.ts') }}-
      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Start and initialize Mongo replica set
        run: |
          timeout 180 docker pull "$CI_MONGO_IMAGE"
          docker run --detach --name kb-ci-mongo \
            --publish 27017:27017 \
            "$CI_MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec kb-ci-mongo mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker logs kb-ci-mongo
              exit 1
            fi
            sleep 1
          done
          docker exec kb-ci-mongo mongo --quiet --eval '
            const hello = db.hello();
            if (!hello.setName) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            } else if (hello.setName !== "rs0") {
              throw new Error(`unexpected replica set: ${hello.setName}`);
            }
          '
          for attempt in $(seq 1 60); do
            state="$(
              docker exec kb-ci-mongo mongo --quiet --eval '
                const status = rs.status();
                status.ok === 1 ? status.myState : -1;
              ' 2>/dev/null || true
            )"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-mongo
          docker exec kb-ci-mongo mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Start MinIO
        run: |
          timeout 300 docker pull "$CI_MINIO_IMAGE"
          docker run --detach --name kb-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            "$CI_MINIO_IMAGE" server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-minio
          exit 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Stop test containers
        if: always()
        run: docker rm --force kb-ci-mongo kb-ci-minio >/dev/null 2>&1 || true

  verify:
    name: verify
    needs: [quality, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all gates
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
