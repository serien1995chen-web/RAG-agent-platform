name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KB_ENV: test
      KB_TEST_MONGO_URI: mongodb://127.0.0.1:27017/kb_test?replicaSet=rs0
      KB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      KB_TEST_PG_URL: postgresql://kb:kb_dev_password@127.0.0.1:5432/kb
      KB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      KB_TEST_S3_REGION: us-east-1
      KB_TEST_S3_BUCKET: kb-test
      KB_TEST_S3_ACCESS_KEY: minioadmin
      KB_TEST_S3_SECRET_KEY: minioadmin
    services:
      mongo:
        image: mongo:5.0.32
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      minio:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Initialize Mongo single-node replica set
        run: |
          container_id="$(docker ps --filter ancestor=mongo:5.0.32 --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          docker exec "$container_id" mongo --quiet --eval '
            try {
              rs.status();
            } catch (error) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            }
          '
          for attempt in $(seq 1 60); do
            state="$(docker exec "$container_id" mongo --quiet --eval 'try { rs.status().myState } catch (error) { -1 }')"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker exec "$container_id" mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture
        run: pnpm architecture:check
      - name: Forbidden files
        run: pnpm forbidden-files:check
      - name: Licenses
        run: pnpm license:check
      - name: SBOM
        run: pnpm sbom:generate
      - name: OpenAPI
        run: pnpm openapi:check
      - name: Knowledge inventory
        run: pnpm knowledge:inventory
      - name: Runtime boundary
        run: pnpm knowledge:check-runtime
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Integration tests
        run: pnpm test:integration
      - name: Tenant tests
        run: pnpm test:tenant
      - name: Concurrency tests
        run: pnpm test:concurrency
      - name: Fault tests
        run: pnpm test:fault
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Build application
        run: pnpm build
      - name: Build worker
        run: pnpm build:workers

  release-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate release artifacts
        run: |
          pnpm sbom:generate
          test -s NOTICE
          test -s artifacts/sbom.json
      - name: Generate CI image override
        run: |
          cat > "$RUNNER_TEMP/ci-images.override.yml" <<'YAML'
          services:
            mongo:
              image: mongo:5.0.32
            mongo-init:
              image: mongo:5.0.32
            redis:
              image: redis:7.2-alpine
            pgvector:
              image: pgvector/pgvector:0.8.0-pg15
            minio:
              image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
          YAML
      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yml -f "$RUNNER_TEMP/ci-images.override.yml" config
      - name: Build application image
        run: docker compose -f deploy/docker-compose.yml build app
      - name: Inspect application image
        run: |
          app_image_id="$(docker image inspect --format '{{.Id}}' rag-agent-platform:kb-baseline)"
          test -n "$app_image_id"
          printf 'app_image_id=%s\n' "$app_image_id"
      - name: Compose health smoke
        run: |
          compose_args=(-f deploy/docker-compose.yml -f "$RUNNER_TEMP/ci-images.override.yml")
          docker compose "${compose_args[@]}" up -d
          for url in \
            http://127.0.0.1:3010/healthz \
            http://127.0.0.1:3010/readyz; do
            healthy=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error --max-time 5 "$url" >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              docker compose "${compose_args[@]}" ps
              docker compose "${compose_args[@]}" logs --no-color
              echo "health check failed: $url"
              exit 1
            fi
          done
          worker_id="$(docker compose "${compose_args[@]}" ps -q worker)"
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$worker_id")" = "healthy"
          test -z "$(docker compose "${compose_args[@]}" port worker 3010)"
          test -n "$(docker compose "${compose_args[@]}" port app 3010)"
      - name: Cleanup
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ci-images.override.yml" ]; then
            docker compose -f deploy/docker-compose.yml -f "$RUNNER_TEMP/ci-images.override.yml" down -v
          fi
