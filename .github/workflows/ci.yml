name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32@sha256:ab12670508974afbdf3bdc7dd39a201d228a73c9c13c70a684b9eedfb063dc3e
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/redis:7.2-alpine@sha256:2bf71743152d3ca631d358029d504fed349ea28179667acfa755dffb4b321e7c
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      pgvector:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15@sha256:92be4ea0424cccf17003f5803d54448e2864ac27a70e6ac5d24b3d8b463c689c
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      minio:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Static gates
        run: pnpm lint && pnpm format:check && pnpm typecheck
      - name: Architecture and compliance gates
        run: pnpm architecture:check && pnpm openapi:check && pnpm forbidden-files:check && pnpm license:check
      - name: Unit and contract tests
        run: pnpm test:unit && pnpm test:contract
      - name: Integration tests
        run: pnpm test:integration
      - name: Full test suites
        run: pnpm test
      - name: Build
        run: pnpm build

  release-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate release artifacts
        run: pnpm sbom:generate
      - name: Verify release artifacts
        run: |
          test -s NOTICE
          test -s artifacts/sbom.json
      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yml config
      - name: Build application image
        run: docker compose -f deploy/docker-compose.yml build app
      - name: Inspect application image
        run: |
          app_image_id="$(docker image inspect --format '{{.Id}}' rag-agent-platform-app)"
          test -n "$app_image_id"
          printf 'app_image_id=%s\n' "$app_image_id"
      - name: Compose health smoke
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/healthz/live >/dev/null
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/readyz >/dev/null
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/startupz >/dev/null
      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
