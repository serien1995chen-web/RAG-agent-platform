name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0.32
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      minio:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Static gates
        run: pnpm lint && pnpm format:check && pnpm typecheck
      - name: Architecture and compliance gates
        run: pnpm architecture:check && pnpm openapi:check && pnpm forbidden-files:check && pnpm license:check
      - name: Unit and contract tests
        run: pnpm test:unit && pnpm test:contract
      - name: Integration tests
        run: pnpm test:integration
      - name: Full test suites
        env:
          NODE_ENV: test
          APP_WORKER_MODE: all
          KB_INSTANCE_ID: ci
          KB_DEPENDENCY_BASELINE_ID: kb-baseline-6.1
          KB_VERSION_CHECK_POLICY: strict
          KB_CONNECT_TIMEOUT_MS: '5000'
          KB_REQUEST_TIMEOUT_MS: '2000'
          KB_MONGO_URI: mongodb://127.0.0.1:27017/kb
          KB_REDIS_URL: redis://127.0.0.1:6379
          KB_PG_URL: postgres://kb:kb_dev_password@127.0.0.1:5432/kb
          KB_S3_ENDPOINT: http://127.0.0.1:9000
          KB_S3_REGION: us-east-1
          KB_S3_BUCKET: kb-source
          KB_S3_ACCESS_KEY_REF: env:MINIO_ROOT_USER
          KB_S3_SECRET_KEY_REF: env:MINIO_ROOT_PASSWORD
          KB_LOG_LEVEL: info
          KB_MONGO_POOL_SIZE: '10'
          KB_REDIS_CONNECTIONS: '2'
          KB_PG_POOL_SIZE: '10'
          KB_S3_CONCURRENCY: '4'
          KB_PROVIDER_CONCURRENCY: '4'
          KB_BATCH_SIZE: '100'
          KB_QUEUE_CONCURRENCY: '4'
          KB_PROVIDER_TIMEOUT_MS: '30000'
          KB_PROVIDER_MAX_RETRIES: '3'
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: pnpm test
      - name: Build
        run: pnpm build
