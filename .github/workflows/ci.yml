      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
