name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KB_ENV: test
      KB_TEST_MONGO_URI: mongodb://127.0.0.1:27017/kb_test?replicaSet=rs0
      KB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      KB_TEST_PG_URL: postgresql://kb:kb_dev_password@127.0.0.1:5432/kb
      KB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      KB_TEST_S3_REGION: us-east-1
      KB_TEST_S3_BUCKET: kb-test
      KB_TEST_S3_ACCESS_KEY: minioadmin
      KB_TEST_S3_SECRET_KEY: minioadmin
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 10s --health-timeout 5s --health-retries 10
      minio:
        image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Start and initialize Mongo replica set
        run: |
          docker run --detach --name kb-ci-mongo \
            --publish 27017:27017 \
            mongo:5.0.32 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec kb-ci-mongo mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker logs kb-ci-mongo
              exit 1
            fi
            sleep 1
          done
          docker exec kb-ci-mongo mongo --quiet --eval '
            const hello = db.hello();
            if (!hello.setName) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            } else if (hello.setName !== "rs0") {
              throw new Error(`unexpected replica set: ${hello.setName}`);
            }
          '
          for attempt in $(seq 1 60); do
            state="$(
              docker exec kb-ci-mongo mongo --quiet --eval '
                const status = rs.status();
                status.ok === 1 ? status.myState : -1;
              ' 2>/dev/null || true
            )"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-mongo
          docker exec kb-ci-mongo mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture
        run: pnpm architecture:check
      - name: Forbidden files
        run: pnpm forbidden-files:check
      - name: Licenses
        run: pnpm license:check
      - name: SBOM
        run: pnpm sbom:generate
      - name: OpenAPI
        run: pnpm openapi:check
      - name: Knowledge inventory
        run: pnpm knowledge:inventory
      - name: Runtime boundary
        run: pnpm knowledge:check-runtime
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Integration tests
        run: pnpm test:integration
      - name: Tenant tests
        run: pnpm test:tenant
      - name: Concurrency tests
        run: pnpm test:concurrency
      - name: Fault tests
        run: pnpm test:fault
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Build application
        run: pnpm build
      - name: Build worker
        run: pnpm build:workers
      - name: Stop Mongo
        if: always()
        run: docker rm --force kb-ci-mongo >/dev/null 2>&1 || true
