name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KB_ENV: test
  KB_TEST_MONGO_URI: mongodb://127.0.0.1:27017/kb_test?replicaSet=rs0
  KB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
  KB_TEST_PG_URL: postgresql://kb:kb_dev_password@127.0.0.1:5432/kb
  KB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
  KB_TEST_S3_REGION: us-east-1
  KB_TEST_S3_BUCKET: kb-test
  KB_TEST_S3_ACCESS_KEY: minioadmin
  KB_TEST_S3_SECRET_KEY: minioadmin
  CI_MONGO_IMAGE: mongo:5.0.32
  CI_MINIO_IMAGE: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture
        run: pnpm architecture:check
      - name: Forbidden files
        run: pnpm forbidden-files:check
      - name: SBOM
        run: pnpm sbom:generate
      - name: Licenses
        run: pnpm license:check
      - name: OpenAPI
        run: pnpm openapi:check
      - name: Knowledge inventory
        run: pnpm knowledge:inventory
      - name: Runtime boundary
        run: pnpm knowledge:check-runtime
      - name: Unit tests
        run: pnpm test:unit
      - name: Contract tests
        run: pnpm test:contract
      - name: Build application
        run: pnpm build
      - name: Build worker
        run: pnpm build:workers
      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yml config

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Start and initialize Mongo replica set
        run: |
          for attempt in 1 2 3; do
            if timeout 180 docker pull "$CI_MONGO_IMAGE"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Mongo image pull failed after three attempts."
              exit 1
            fi
            echo "::warning::Mongo image pull failed; retrying."
            sleep 5
          done
          docker run --detach --name kb-ci-mongo \
            --publish 27017:27017 \
            "$CI_MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec kb-ci-mongo mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker logs kb-ci-mongo
              exit 1
            fi
            sleep 1
          done
          docker exec kb-ci-mongo mongo --quiet --eval '
            const hello = db.hello();
            if (!hello.setName) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            } else if (hello.setName !== "rs0") {
              throw new Error(`unexpected replica set: ${hello.setName}`);
            }
          '
          for attempt in $(seq 1 60); do
            state="$(
              docker exec kb-ci-mongo mongo --quiet --eval '
                const status = rs.status();
                status.ok === 1 ? status.myState : -1;
              ' 2>/dev/null || true
            )"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-mongo
          docker exec kb-ci-mongo mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Start MinIO
        run: |
          if ! docker image inspect "$CI_MINIO_IMAGE" >/dev/null 2>&1; then
            for attempt in 1 2; do
              if timeout 600 docker pull "$CI_MINIO_IMAGE"; then
                break
              fi
              if [ "$attempt" = "2" ]; then
                echo "::error::MinIO image pull failed after two attempts."
                exit 1
              fi
              echo "::warning::MinIO image pull failed; retrying in 30 seconds."
              sleep 30
            done
          fi
          docker run --detach --name kb-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            "$CI_MINIO_IMAGE" server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-minio
          exit 1
      - name: Integration tests
        run: pnpm test:integration
      - name: Tenant tests
        run: pnpm test:tenant
      - name: Concurrency tests
        run: pnpm test:concurrency
      - name: Fault tests
        run: pnpm test:fault
      - name: Security tests
        run: pnpm test:security
      - name: Stop test containers
        if: always()
        run: docker rm --force kb-ci-mongo kb-ci-minio >/dev/null 2>&1 || true

  b17-provider:
    name: b17-provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Require TokenDance secrets
        env:
          AIPROXY_BASE_URL: ${{ secrets.AIPROXY_BASE_URL }}
          AIPROXY_API_TOKEN: ${{ secrets.AIPROXY_API_TOKEN }}
        run: |
          missing=()
          test -n "${AIPROXY_BASE_URL:-}" || missing+=("AIPROXY_BASE_URL")
          test -n "${AIPROXY_API_TOKEN:-}" || missing+=("AIPROXY_API_TOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::SCOPED_BLOCKED: missing GitHub secrets ${missing[*]}"
            exit 2
          fi
      - name: B17 real TokenDance provider
        env:
          S11_SCOPE_PROFILE: knowledge-usability-v1
          S11_PROVIDER_MODE: real
          AIPROXY_MODE: openai
          AIPROXY_BASE_URL: ${{ secrets.AIPROXY_BASE_URL }}
          AIPROXY_API_TOKEN: ${{ secrets.AIPROXY_API_TOKEN }}
          S11_AIPROXY_MODEL_MAPPING_APPROVED: 'true'
          S11_AIPROXY_LLM_MODEL: qwen3.7-plus
          S11_AIPROXY_EMBEDDING_MODEL: qwen3.7-text-embedding
          S11_AIPROXY_RERANK_MODEL: qwen3.7-text-rerank
          S11_AIPROXY_VLM_MODEL: kimi-k2.5
          S11_AIPROXY_VISION_EMBEDDING_MODEL: qwen3.7-text-embedding
          AIPROXY_MODEL_PROFILE_JSON: '{"models":[{"id":"qwen3.7-plus","type":"llm","capabilities":["chat"]},{"id":"qwen3.7-text-embedding","type":"embedding","capabilities":["text-embedding","caption-embedding"],"dimension":1024},{"id":"qwen3.7-text-rerank","type":"rerank","capabilities":["rerank"]},{"id":"kimi-k2.5","type":"vlm","capabilities":["vision"]}]}'
          S11_EVIDENCE_DIR: ${{ runner.temp }}/b17-provider-evidence
          B17_PROVIDER_EVIDENCE_DIR: ${{ runner.temp }}/b17-provider-evidence
          CANDIDATE_SHA: ${{ github.sha }}
          S11_PROVIDER_FIXTURE_SHA256: 992e4b4644487cfc8018b1d16b01b018ed318a371da2fdfc23fd9a2ff3da9546
        run: pnpm test:provider:real -- s11-b17-deep-real
      - name: Upload B17 provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b17-provider-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b17-provider-evidence
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      pgvector:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_dev_password
          POSTGRES_DB: kb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Restore Next cache
        uses: actions/cache@v4
        with:
          path: projects/app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'projects/app/next.config.ts') }}-${{ github.run_id }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'projects/app/next.config.ts') }}-
      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Start and initialize Mongo replica set
        run: |
          for attempt in 1 2 3; do
            if timeout 180 docker pull "$CI_MONGO_IMAGE"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Mongo image pull failed after three attempts."
              exit 1
            fi
            echo "::warning::Mongo image pull failed; retrying."
            sleep 5
          done
          docker run --detach --name kb-ci-mongo \
            --publish 27017:27017 \
            "$CI_MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec kb-ci-mongo mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker logs kb-ci-mongo
              exit 1
            fi
            sleep 1
          done
          docker exec kb-ci-mongo mongo --quiet --eval '
            const hello = db.hello();
            if (!hello.setName) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            } else if (hello.setName !== "rs0") {
              throw new Error(`unexpected replica set: ${hello.setName}`);
            }
          '
          for attempt in $(seq 1 60); do
            state="$(
              docker exec kb-ci-mongo mongo --quiet --eval '
                const status = rs.status();
                status.ok === 1 ? status.myState : -1;
              ' 2>/dev/null || true
            )"
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-mongo
          docker exec kb-ci-mongo mongo --quiet --eval 'rs.status()'
          exit 1
      - name: Start MinIO
        run: |
          if ! docker image inspect "$CI_MINIO_IMAGE" >/dev/null 2>&1; then
            for attempt in 1 2; do
              if timeout 600 docker pull "$CI_MINIO_IMAGE"; then
                break
              fi
              if [ "$attempt" = "2" ]; then
                echo "::error::MinIO image pull failed after two attempts."
                exit 1
              fi
              echo "::warning::MinIO image pull failed; retrying in 30 seconds."
              sleep 30
            done
          fi
          docker run --detach --name kb-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            "$CI_MINIO_IMAGE" server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-ci-minio
          exit 1
      - name: Install Chromium headless shell
        timeout-minutes: 14
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm exec playwright install --only-shell --no-progress chromium; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "::warning::Chromium headless shell installation failed; retrying."
            sleep 5
          done
      - name: Build application
        run: pnpm build
      - name: Build worker
        run: pnpm build:workers
      - name: Verify e2e build artifacts
        run: |
          test -s projects/app/.next/BUILD_ID
          test -s projects/app/dist/workers/worker.mjs
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload B12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b12-e2e-evidence-${{ github.run_attempt }}
          path: test-results/b12/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop test containers
        if: always()
        run: docker rm --force kb-ci-mongo kb-ci-minio >/dev/null 2>&1 || true

  performance:
    name: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KB_QUOTA_PROFILE: s11-perf-v1
