name: rag-agent-platform

x-knowledge-environment: &knowledge-environment
  KB_ENV: ${KB_ENV:-development}
  KB_INSTANCE_ID: ${KB_INSTANCE_ID:-compose-1}
  KB_PORT: '3010'
  KB_MONGO_URI: mongodb://mongo:27017/${KB_MONGO_DATABASE:-rag_agent_platform}
  KB_REDIS_URL: redis://redis:6379/${KB_REDIS_DATABASE:-0}
  KB_PG_URL: postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb_dev_password}@pgvector:5432/${POSTGRES_DB:-kb}
  KB_S3_VENDOR: ${KB_S3_VENDOR:-minio}
  KB_S3_ENDPOINT: http://minio:9000
  KB_S3_REGION: ${KB_S3_REGION:-us-east-1}
  KB_S3_BUCKET: ${KB_S3_BUCKET:-kb-local}
  KB_S3_ACCESS_KEY_REF: env:MINIO_ROOT_USER
  KB_S3_SECRET_KEY_REF: env:MINIO_ROOT_PASSWORD
  KB_FILE_PUBLIC_BASE_URL: ${KB_FILE_PUBLIC_BASE_URL:-http://localhost:3010}
  KB_FILE_TICKET_SECRET_REF: env:KB_FILE_TICKET_SECRET
  KB_FILE_TICKET_SECRET: ${KB_FILE_TICKET_SECRET:-local-file-ticket-secret-32-bytes-minimum}
  KB_AUTH_MODE: ${KB_AUTH_MODE:-mock}
  KB_MOCK_AUTH_TOKEN: ${KB_MOCK_AUTH_TOKEN:-kb-dev-console-token-0000000000}
  KB_MOCK_WORKSPACE_ID: ${KB_MOCK_WORKSPACE_ID:-ws_compose_local}
  KB_MOCK_MEMBER_ID: ${KB_MOCK_MEMBER_ID:-mem_compose_owner}
  KB_MOCK_SCOPES: ${KB_MOCK_SCOPES:-knowledge:read,knowledge:write,knowledge:manage,knowledge:admin}
  KB_MOCK_WORKSPACE_OWNER: ${KB_MOCK_WORKSPACE_OWNER:-true}
  KB_EXTERNAL_MODEL_MODE: ${KB_EXTERNAL_MODEL_MODE:-mock}
  KB_EXTERNAL_OCR_MODE: ${KB_EXTERNAL_OCR_MODE:-mock}
  KB_EXTERNAL_CONNECTOR_MODE: ${KB_EXTERNAL_CONNECTOR_MODE:-mock}
  KB_LOG_LEVEL: ${KB_LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  mongo:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32@sha256:ab12670508974afbdf3bdc7dd39a201d228a73c9c13c70a684b9eedfb063dc3e
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32@sha256:ab12670508974afbdf3bdc7dd39a201d228a73c9c13c70a684b9eedfb063dc3e
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - >
        until mongo --host mongo:27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 1; done;
        mongo --host mongo:27017 --quiet --eval '
        const h = db.hello();
        if (!h.setName) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
        ';
        for i in $(seq 1 60); do
        state=$(mongo --host mongo:27017 --quiet --eval "try{rs.status().myState}catch(e){-1}");
        [ \"$$state\" = \"1\" ] && echo 'replica set PRIMARY ready' && exit 0;
        sleep 1;
        done;
        echo 'replica set did not reach PRIMARY' >&2; exit 1;

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/redis:7.2-alpine@sha256:2bf71743152d3ca631d358029d504fed349ea28179667acfa755dffb4b321e7c
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15@sha256:92be4ea0424cccf17003f5803d54448e2864ac27a70e6ac5d24b3d8b463c689c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kb} -d ${POSTGRES_DB:-kb}']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: rag-agent-platform:kb-baseline
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ['pnpm', '--filter', '@kb/app', 'start']
    environment:
      <<: *knowledge-environment
      KB_APP_WORKER_MODE: http
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '3010:3010'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3010/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: rag-agent-platform:kb-baseline
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ['node', 'projects/app/dist/workers/worker.mjs']
    environment:
      <<: *knowledge-environment
      KB_APP_WORKER_MODE: worker
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/knowledge-worker-ready']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  redis-data:
  pg-data:
  minio-data:
