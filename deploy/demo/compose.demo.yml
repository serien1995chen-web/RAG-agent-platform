# 知识库验收 demo 的独立依赖栈（project=kb-demo）。
# 与用户环境、审计环境完全隔离：独立端口、独立卷。
name: kb-demo

services:
  mongo:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32@sha256:ab12670508974afbdf3bdc7dd39a201d228a73c9c13c70a684b9eedfb063dc3e
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27019:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 一次性初始化单节点副本集（删除链路依赖事务）。
  mongo-init:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32@sha256:ab12670508974afbdf3bdc7dd39a201d228a73c9c13c70a684b9eedfb063dc3e
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - >
        until mongo --host mongo:27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 1; done;
        mongo --host mongo:27017 --quiet --eval '
        const h = db.hello();
        if (!h.setName) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
        ';
        for i in $(seq 1 60); do
        state=$(mongo --host mongo:27017 --quiet --eval "try { rs.status().myState } catch (e) { -1 }");
        [ "$$state" = "1" ] && echo 'replica set PRIMARY ready' && exit 0;
        sleep 1;
        done;
        echo 'replica set did not reach PRIMARY' >&2; exit 1;

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/redis:7.2-alpine@sha256:2bf71743152d3ca631d358029d504fed349ea28179667acfa755dffb4b321e7c
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15@sha256:92be4ea0424cccf17003f5803d54448e2864ac27a70e6ac5d24b3d8b463c689c
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_demo_password
      POSTGRES_DB: kb
    ports:
      - '5434:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../init/pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kb -d kb']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a63b19df59e6ec7c02ebba6e7a1097b7e032da7947b18db7ff67dae8e84fd44d
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9005']
    environment:
      MINIO_ROOT_USER: kb_demo_minio
      MINIO_ROOT_PASSWORD: kb_demo_minio_password
    ports:
      - '9004:9000'
      - '9005:9005'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  pg-data:
  minio-data:
